{% extends 'refugio/base.html' %}

{% block title %}Gestión Interna - Refugio Huellitas{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-10">
        <div class="card shadow-sm p-4 mb-4 bg-white border-0">
            <h1 class="h2 text-primary fw-bold mb-1">Área de Gestión Interna</h1>
            <p class="text-muted">Bienvenido, <strong>{{ user.username }}</strong></p>
            <hr>
            <p class="mb-0">Página de control interno para usuarios autenticados.</p>
        </div>

        <div class="card shadow-sm p-3 p-md-4 bg-white border-0">
            <h3 class="h5 mb-3 text-secondary text-center">Galería de Gestión</h3>
            
            <div class="col-12 col-md-8 col-lg-6 mx-auto">
                <div id="carouselExampleIndicators" class="carousel slide shadow rounded overflow-hidden">
                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                        <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
                    </div>
                    <div class="carousel-inner">
                        <div class="carousel-item active">
                            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTc4KxO4V8oG8yChbMHpvp7hQdtSnAscyy4oU2BTzpc50oqNtxvEKVPGnOz&s=10" class="d-block w-100 object-fit-cover" alt="Gatos" style="height: 280px;">
                        </div>
                        <div class="carousel-item">
                            <img src="https://www.elimparcial.com/resizer/v2/4EHR744F5BFG5FHZOJR72NBMHE.jpg?auth=8560193a58574f47cec873815d5d434a238d1f84739c1746e5e22bdbbda63c3c&smart=true&width=1200&height=800&quality=70" class="d-block w-100 object-fit-cover" alt="Camaleon" style="height: 280px;">
                        </div>
                        <div class="carousel-item">
                            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSFNhYOxInH5L04_pPP4HhdI7sQttOc1IFX8S4Te31XzkqH3kHvqgjSo0Gw&s=10" class="d-block w-100 object-fit-cover" alt="Beto_y_la_dueña" style="height: 280px;">
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Anterior</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Siguiente</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
